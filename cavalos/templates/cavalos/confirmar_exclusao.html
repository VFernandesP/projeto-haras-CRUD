{% extends "cavalos/base.html" %}
{% block title %}Excluir Cavalo{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-header bg-danger text-white">
        <h3 class="h4 mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar Exclusão</h3>
    </div>
    <div class="card-body text-center">
        <p class="fs-5">Tem certeza que deseja excluir o cavalo <strong>"{{ cavalo.nome }}"</strong>?</p>
        <p class="text-muted">Esta ação não pode ser desfeita.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">
                <i class="bi bi-check2"></i> Sim, excluir
            </button>
            <a href="{% url 'cavalos:lista_cavalos' %}" class="btn btn-secondary btn-lg">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
