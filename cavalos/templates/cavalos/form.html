{% extends "cavalos/base.html" %}
{% block title %}{{ acao }} Cavalo{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 700px;">
    <div class="card-header bg-success text-white">
        <h3 class="h4 mb-0"><i class="bi bi-pencil-square"></i> {{ acao }} Cavalo</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% if cavalo and cavalo.foto %}
                <div class="mb-3 text-center">
                    <label class="fw-bold">Foto atual:</label><br>
                    <img src="{{ cavalo.foto.url }}" alt="Foto atual" class="img-thumbnail" style="max-height: 200px; border-radius: 12px;">
                    <p class="text-muted small mt-1">{{ cavalo.foto.name }}</p>
                </div>
            {% endif %}

            {{ form.as_p }}

            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-success"><i class="bi bi-check2"></i> Salvar</button>
                <a href="{% url 'cavalos:lista_cavalos' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.querySelector('#data_nascimento');
    if (input) {
        // Máscara para inserir "/" automaticamente
        input.addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            if (value.length > 5) {
                value = value.substring(0, 5) + '/' + value.substring(5, 9);
            }
            this.value = value;
        });

        // Inicializa o Flatpickr (calendário)
        flatpickr(input, {
            dateFormat: "d/m/Y",
            altInput: true,
            altFormat: "d/m/Y",
            locale: "pt",
            allowInput: true,
            maxDate: "today",
            yearSelectorType: "dropdown",
            monthSelectorType: "dropdown"
        });
    }
});
</script>
{% endblock %}
