{% extends "cavalos/base.html" %}
{% block title %}{{ acao }} Cavalo{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 700px;">
    <div class="card-header bg-success text-white">
        <h3 class="h4 mb-0"><i class="bi bi-pencil-square"></i> {{ acao }} Cavalo</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Exibe a prévia da foto se estiver editando e houver foto -->
            {% if cavalo and cavalo.foto %}
                <div class="mb-3 text-center">
                    <label class="fw-bold">Foto atual:</label><br>
                    <img src="{{ cavalo.foto.url }}" alt="Foto atual" class="img-thumbnail" style="max-height: 200px; border-radius: 12px;">
                    <p class="text-muted small mt-1">{{ cavalo.foto.name }}</p>
                </div>
            {% endif %}

            {{ form.as_p }}

            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check2"></i> Salvar
                </button>
                <a href="{% url 'cavalos:lista_cavalos' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    flatpickr("#data_nascimento", {
        dateFormat: "d/m/Y",           // formato de exibição
        altInput: true,
        altFormat: "d/m/Y",            // formato alternativo
        locale: "pt",                  // português
        allowInput: true,              // permite digitar também
        maxDate: "today",              // não permite datas futuras
        yearSelectorType: "dropdown",  // facilita seleção de anos
        monthSelectorType: "dropdown"
    });
});
</script>
{% endblock %}
